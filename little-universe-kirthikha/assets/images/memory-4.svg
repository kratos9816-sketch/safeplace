      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="60%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <!-- Horizon line -->
