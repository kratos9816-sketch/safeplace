  <text x="400" y="490" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="18" fill="#e0e0e8" letter-spacing="3">UNDER THE SILVER TWILIGHT</text>
  <text x="400" y="518" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888894" letter-spacing="2">QUIET PROMISES BEFORE THE STARS</text>
