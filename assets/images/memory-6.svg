<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608"/>
      <stop offset="50%" stop-color="#14141d"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg6)"/>
  <!-- Window frame -->
  <rect x="280" y="160" width="240" height="260" rx="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <line x1="400" y1="160" x2="400" y2="420" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="280" y1="290" x2="520" y2="290" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Raindrops on glass -->
  <line x1="320" y1="190" x2="315" y2="210" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="360" y1="230" x2="355" y2="250" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="440" y1="200" x2="435" y2="220" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="480" y1="260" x2="475" y2="280" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <text x="400" y="480" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="18" fill="#e0e0e8" letter-spacing="3">RAIN ON THE WINDOW, WARMTH INSIDE</text>
  <text x="400" y="508" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888894" letter-spacing="2">WHEN THE WHOLE WORLD DISAPPEARED</text>
</svg>